name: ts

on:
  pull_request:
    paths:
      - src/**
      - tests/**
      - '*.json'
      - '*.yaml'
      - .github/workflows/ts.yaml
  push:
    branches:
      - main
    paths:
      - src/**
      - tests/**
      - '*.json'
      - '*.yaml'
      - .github/workflows/ts.yaml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - run: npm install -g corepack
      - run: corepack enable
      - run: pnpm i
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - run: npm install -g corepack
      - run: corepack enable
      - run: pnpm i
      - run: pnpm build

      - name: Remove the label before testing
        uses: ./
        with:
          remove-labels: label-action-test

      - name: Run int128/label-action
        id: add-labels
        uses: ./
        with:
          add-labels: label-action-test
      - run: test ${{ steps.add-labels.outputs.added-count }} == 1
      - run: test ${{ steps.add-labels.outputs.added }} == 'true'

      - name: Run int128/label-action
        id: re-add-labels
        uses: ./
        with:
          add-labels: label-action-test
      - run: test ${{ steps.re-add-labels.outputs.added-count }} == 0
      - run: test ${{ steps.re-add-labels.outputs.added }} == 'false'

      - name: Run int128/label-action
        id: match-labels
        uses: ./
        with:
          match-labels: /-action-test$/
      - run: test ${{ steps.match-labels.outputs.matched-count }} == 1
      - run: test ${{ steps.match-labels.outputs.matched }} == 'true'

      - name: Run int128/label-action
        id: match-all-labels
        uses: ./
        with:
          match-labels: /.*/
      - run: |
          set -eux
          test -n "$LABELS"
          while read -r label; do
            echo "Label: $label"
          done <<< "$LABELS"
        env:
          LABELS: ${{ steps.match-all-labels.outputs.matched-labels }}

      - name: Run int128/label-action
        id: remove-labels
        uses: ./
        with:
          remove-labels: label-action-test
      - run: test ${{ steps.remove-labels.outputs.removed-count }} == 1
      - run: test ${{ steps.remove-labels.outputs.removed }} == 'true'

      - name: Run int128/label-action
        id: re-remove-labels
        uses: ./
        with:
          remove-labels: label-action-test
      - run: test ${{ steps.re-remove-labels.outputs.removed-count }} == 0
      - run: test ${{ steps.re-remove-labels.outputs.removed }} == 'false'

      - name: Run int128/label-action
        id: desired-labels-add
        uses: ./
        with:
          desired-labels: label-action-test
          desired-state: true
      - run: test ${{ steps.desired-labels-add.outputs.added-count }} == 1
      - run: test ${{ steps.desired-labels-add.outputs.added }} == 'true'

      - name: Run int128/label-action
        id: desired-labels-remove
        uses: ./
        with:
          desired-labels: label-action-test
          desired-state: false
      - run: test ${{ steps.desired-labels-remove.outputs.removed-count }} == 1
      - run: test ${{ steps.desired-labels-remove.outputs.removed }} == 'true'

  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .node-version
      - run: npm install -g corepack
      - run: corepack enable
      - run: pnpm i
      - run: pnpm run check
      - uses: int128/update-generated-files-action@4d9ed59b1c0673b7a42be5dbb71b993f96d4beb7 # v2.108.0
